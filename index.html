<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCLUSIVE</title>
<link rel="icon" href="https://i.ibb.co/vCwwgQ2D/TRAP-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f2ff;--dim:rgba(245,242,255,.55);--gold:#d4af37;}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);background:#050505;font-family:Outfit,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bgvideo{position:fixed;top:50%;left:50%;z-index:-3;min-width:100%;min-height:100%;transform:translate(-50%,-50%) scale(1.1);object-fit:cover;filter:brightness(.28) blur(1px);}
.bgshade{position:fixed;inset:0;z-index:-2;background: radial-gradient(ellipse at center,rgba(0,0,0,.2) 0%, rgba(0,0,0,.7) 100%);}
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(4,4,4,.85);backdrop-filter:blur(10px);transition:opacity.6s ease;}
.gatebox{text-align:center;animation:fadeIn 1s ease;display:flex;flex-direction:column;align-items:center;gap:30px;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.gatelogo{width:280px;height:280px;object-fit:contain;filter:drop-shadow(0 0 25px rgba(212,175,55,.5));animation:glow 2s ease-in-out infinite alternate;}
@keyframes glow{from{filter:drop-shadow(0 0 20px rgba(212,175,55,.4))}to{filter:drop-shadow(0 0 40px rgba(212,175,55,.8))}}
#gobtn{padding:18px 50px;color:#fff;border:2px solid #d4af37;border-radius:12px;background:rgba(212,175,55,.1);font-size:.9rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;}
#gobtn:hover{background:#d4af37;color:#000;}
.wrap{width:100%;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity.5s ease;padding:60px 20px;}
.wrap.show{opacity:1}
.tag{color:var(--dim);font-size:.68rem;letter-spacing:1.5px;text-align:center;margin-bottom:30px;}
.rule{width:60px;height:2px;margin:0 0 40px;background:var(--gold);}
.person{width:154px;min-height:210px;padding:12px 10px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);transition:.35s ease;}
.person:hover{border-color:var(--gold);transform:translateY(-5px);}
.pface{width:94px;height:94px;margin:0 auto;border-radius:50%;overflow:hidden;}
.pface img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pplacard{margin-top:8px;padding:8px;border:1px solid rgba(220,210,255,.14);border-radius:9px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);text-align:center;}
.player{width:min(600px,calc(100% - 40px));margin:40px auto 0;padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);display:flex;gap:20px;align-items:center;}
.player-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ink);width:36px;height:36px;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>

<video class="bgvideo" autoplay loop muted playsinline>
<source src="https://i.imgur.com/vFys77C.mp4" type="video/mp4">
</video>
<div class="bgshade"></div>

<div id="gate">
    <div class="gatebox">
        <img src="https://i.imgur.com/ttr8wP0.png" class="gatelogo" alt="EXCLUSIVE">
        <button id="gobtn">Sa ngalan ng Exclusive. Amen.</button>
    </div>
</div>

<main class="wrap">
<p class="tag">“exclusive owns u.”</p>
<div class="rule"></div>

<article class="person">
    <div class="pface"><img src="pic.jpg"></div> <!-- ITO YUNG PIC MO -->
    <div class="pplacard">
        <div class="pname">/$</div>
        <div class="phandle">@htrb1734</div>
        <div class="pstatus">Online</div>
    </div>
</article>

<div class="player">
    <div class="player-cover">
        <img src="pic.jpg" alt="cover"> <!-- COVER GINAMIT KO NA DIN PIC MO -->
    </div>
    <div class="player-info">
        <div class="player-title">DIE FOR ME</div>
        <div class="player-artist">CHASE ATLANTIC</div>
        <div class="player-controls">
            <button class="player-btn" id="playBtn">▶</button>
        </div>
    </div>
</div>
</main>

<script>
document.getElementById("gobtn").addEventListener("click",function(){
document.getElementById("gate").style.opacity="0";
document.querySelector(".wrap").classList.add("show");
setTimeout(function(){document.getElementById("gate").remove()},600);
});

var audio = new Audio();
audio.src = "Chase Atlantic - DIE FOR ME (Offi..."; // PALITAN MO FULL NAME KUNG NAPUTOL
audio.volume = 0.6;
var isPlaying = false;
var playBtn = document.getElementById("playBtn");

playBtn.addEventListener("click",function(){
if(isPlaying){ audio.pause(); playBtn.innerHTML = "▶"; isPlaying = false;}
else{ audio.play(); playBtn.innerHTML = "⏸"; isPlaying = true;}
});
</script>
</body>
</html>
